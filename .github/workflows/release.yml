name: Release

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package-build tools
        run: python -m pip install --upgrade pip build twine

      - name: Validate release tag against package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(
            python - <<'PY'
          from pathlib import Path
          import tomllib

          metadata = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          print(metadata["project"]["version"])
          PY
          )"

          TAG_VERSION="${RELEASE_TAG#v}"

          echo "Release tag: ${RELEASE_TAG}"
          echo "Package version: ${PACKAGE_VERSION}"

          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Remove previous build artefacts
        run: rm -rf build dist

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Inspect generated distributions
        run: |
          echo "Generated release distributions:"
          ls -lh dist

          distribution_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"

          if [ "${distribution_count}" -ne 2 ]; then
            echo "::error::Expected exactly two distributions, found ${distribution_count}."
            exit 1
          fi

          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"

      - name: Upload validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish distributions to PyPI
    if: github.event_name == 'release'
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - name: Display distributions selected for publishing
        run: ls -lh dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
