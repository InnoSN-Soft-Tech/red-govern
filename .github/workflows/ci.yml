name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile Python package
        run: python -m compileall -q src/red_govern

      - name: Run Ruff
        run: python -m ruff check src tests scripts

      - name: Run MyPy
        run: |
          python -m mypy src
          python -m mypy \
            scripts/validate_distribution_contents.py \
            scripts/validate_problem_taxonomy.py \
            scripts/validate_discoverability_assets.py \
            scripts/validate_agent_assets.py \
            scripts/evaluate_agent_skill.py \
            scripts/build_agent_skill_distribution.py \
            scripts/validate_custom_gpt_assets.py \
            scripts/validate_remote_metadata_contract.py

      - name: Validate problem taxonomy
        run: python scripts/validate_problem_taxonomy.py

      - name: Validate discoverability assets
        run: python scripts/validate_discoverability_assets.py

      - name: Validate portable agent assets
        run: python scripts/validate_agent_assets.py

      - name: Validate Custom GPT assets
        run: python scripts/validate_custom_gpt_assets.py

      - name: Validate remote metadata contract
        run: python scripts/validate_remote_metadata_contract.py

      - name: Evaluate agent Skill contract
        run: python scripts/evaluate_agent_skill.py

      - name: Validate deterministic Skill distribution
        run: python scripts/build_agent_skill_distribution.py --check

      - name: Run tests and enforce coverage
        run: python -m pytest -q

      - name: Build documentation
        run: mkdocs build --strict --site-dir "${RUNNER_TEMP}/red-govern-site"

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile Python package
        run: python -m compileall -q src/red_govern

      - name: Validate problem taxonomy
        run: python scripts/validate_problem_taxonomy.py

      - name: Validate discoverability assets
        run: python scripts/validate_discoverability_assets.py

      - name: Validate portable agent assets
        run: python scripts/validate_agent_assets.py

      - name: Validate Custom GPT assets
        run: python scripts/validate_custom_gpt_assets.py

      - name: Validate remote metadata contract
        run: python scripts/validate_remote_metadata_contract.py

      - name: Evaluate agent Skill contract
        run: python scripts/evaluate_agent_skill.py

      - name: Validate deterministic Skill distribution
        run: python scripts/build_agent_skill_distribution.py --check

      - name: Run compatibility tests
        run: python -m pytest -q --no-cov

  openai-agents:
    name: OpenAI Agents SDK adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install isolated Agents adapter dependencies
        run: |
          python -m pip install --editable ".[agents]"
          python -m pip install             "pytest>=8,<10" "pytest-cov>=5,<8"             "mypy>=1.13,<3"             "types-PyYAML>=6,<7"             "types-openpyxl>=3.1.5,<4"

      - name: Verify isolated dependency set
        run: python -m pip check

      - name: Compile Python package
        run: python -m compileall -q src/red_govern

      - name: Type-check OpenAI Agents adapter
        run: |
          python -m mypy             --disallow-untyped-decorators             --warn-return-any             src/red_govern/openai_agents.py

      - name: Validate agent assets
        run: python scripts/validate_agent_assets.py

      - name: Run OpenAI Agents adapter tests
        run: python -m pytest -q tests/unit/test_openai_agents.py --no-cov

  package:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality
      - compatibility
      - openai-agents

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package-build tools
        run: python -m pip install --upgrade pip build twine

      - name: Remove previous build artefacts
        run: rm -rf build dist

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Validate distribution contents
        run: python scripts/validate_distribution_contents.py dist

      - name: Display generated distributions
        run: |
          echo "Generated package files:"
          ls -lh dist

      - name: Install wheel in isolated environment
        run: |
          python -m venv "${RUNNER_TEMP}/red-govern-package-test"
          "${RUNNER_TEMP}/red-govern-package-test/bin/python"             -m pip install --upgrade pip
          "${RUNNER_TEMP}/red-govern-package-test/bin/python"             -m pip install dist/*.whl

      - name: Verify installed package
        run: |
          "${RUNNER_TEMP}/red-govern-package-test/bin/python"             -m pip check
          "${RUNNER_TEMP}/red-govern-package-test/bin/python"             -c "import red_govern; print('Imported:', red_govern.__version__)"
          "${RUNNER_TEMP}/red-govern-package-test/bin/red-govern" version
          "${RUNNER_TEMP}/red-govern-package-test/bin/red-govern" --help
