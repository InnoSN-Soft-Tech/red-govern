site_name: Red-Govern
site_description: Local-first governance and operational intelligence for Amazon Redshift.
site_url: https://InnoSN-Soft-Tech.github.io/red-govern
repo_url: https://github.com/InnoSN-Soft-Tech/red-govern
repo_name: InnoSN-Soft-Tech/red-govern
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quick-start.md
      - Configuration: configuration.md
  - Problem guide:
      - Problem taxonomy: problems/index.md
      - Recommendation boundaries: problems/recommendation-boundaries.md
      - Agent integration contract: problems/agent-integration-contract.md
  - AI agents:
      - Overview: agents/index.md
      - Installation: agents/installation.md
      - Python API: agents/api.md
      - Local stdio MCP: agents/mcp.md
      - OpenAI Agents SDK: agents/openai-agents.md
      - Remote metadata API: agents/remote-metadata-api.md
      - Evaluations and distribution: agents/evaluations.md
  - Redshift:
      - Compatibility: compatibility.md
      - Permissions: permissions.md
      - Limitations: limitations.md
  - Trust and safety:
      - Privacy: privacy.md
      - Security: security.md

copyright: "Copyright &copy; InnoSN Soft Tech"
