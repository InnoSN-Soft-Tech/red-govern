[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "red-govern"
version = "0.1.0a3"
description = "Local-first governance and operational intelligence for Amazon Redshift."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PolyForm-Perimeter-1.0.1"
license-files = [
    "LICENSE.md",
    "NOTICE",
    "COMMERCIAL_LICENSE.md",
    "TRADEMARKS.md",
]

authors = [
    { name = "InnoSN Soft Tech" },
]

maintainers = [
    { name = "Naman Sharma" },
]

keywords = [
    "amazon-redshift",
    "redshift",
    "redshift-governance",
    "redshift-monitoring",
    "data-governance",
    "database-governance",
    "data-warehouse",
    "database-monitoring",
    "query-monitoring",
    "data-engineering",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

dependencies = [
    "redshift-connector>=2.1.14,<3",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "rich>=13,<16",
    "platformdirs>=4,<5",
    "keyring>=25,<27",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1,<4",
]

aws = [
    "boto3>=1.34,<2",
]

html = [
    "jinja2>=3.1,<4",
]

mcp = [
    "mcp>=2.0,<3",
]

agents = [
    "openai-agents>=0.19.4,<0.20",
]

all = [
    "openpyxl>=3.1,<4",
    "boto3>=1.34,<2",
    "jinja2>=3.1,<4",
    "mcp>=2.0,<3",
]

dev = [
    "build>=1.2,<2",
    "twine>=5,<8",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "mypy>=1.13,<3",
    "pre-commit>=4,<5",
    "types-PyYAML>=6,<7",
    "types-openpyxl>=3.1.5,<4",
    "tomli>=2,<3; python_version < '3.11'",
    "mcp>=2.0,<3",
]

[project.scripts]
red-govern = "red_govern.cli.app:app"
red-govern-mcp = "red_govern.mcp_server:main"

[project.urls]
Homepage = "https://github.com/InnoSN-Soft-Tech/red-govern"
Documentation = "https://InnoSN-Soft-Tech.github.io/red-govern"
Repository = "https://github.com/InnoSN-Soft-Tech/red-govern"
Issues = "https://github.com/InnoSN-Soft-Tech/red-govern/issues"
Changelog = "https://github.com/InnoSN-Soft-Tech/red-govern/blob/main/CHANGELOG.md"
Developer = "https://github.com/InnoSN-Soft-Tech"
Company = "https://snsoft.tech"

[tool.hatch.build.targets.wheel]
packages = ["src/red_govern"]

[tool.hatch.build]
include = [
    "src/red_govern/**/*.py",
    "src/red_govern/**/*.yml",
    "src/red_govern/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE.md",
    "/NOTICE",
    "/COMMERCIAL_LICENSE.md",
    "/CHANGELOG.md",
    "/DISCLAIMER.md",
    "/TRADEMARKS.md",
    "/PRIVACY.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=red_govern",
    "--cov-branch",
    "--cov-report=term-missing",
]
filterwarnings = [
    "error::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["red_govern"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# Enforce the measured alpha baseline; raise this toward 85 as
# high-value CLI and integration paths gain regression coverage.
fail_under = 74

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["red_govern"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["red_govern"]
mypy_path = "src"
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "red_govern.openai_agents"
disallow_untyped_decorators = false
warn_return_any = false


[[tool.mypy.overrides]]
module = "agents"
ignore_missing_imports = true

[tool.red_govern]
default_config = "src/red_govern/resources/default_config.yml"
